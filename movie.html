<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzz-Net - Фильмы</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f0f1a; color: #fff; min-height: 100vh; }
        
        .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s ease; }
        .navbar.scrolled { background: rgba(15, 15, 26, 0.95); backdrop-filter: blur(10px); }
        .nav-logo { font-size: 1.5rem; font-weight: bold; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-links { display: flex; gap: 2rem; }
        .nav-links a { color: #fff; text-decoration: none; transition: color 0.3s; }
        .nav-links a:hover { color: #667eea; }
        
        #loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .spinner { width: 50px; height: 50px; border: 4px solid rgba(102, 126, 234, 0.3); border-top-color: #667eea; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .movie-hero { position: relative; min-height: 100vh; padding-top: 80px; }
        .movie-backdrop { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-size: cover; background-position: center; filter: blur(3px); opacity: 0.3; }
        .movie-hero-content { position: relative; display: flex; gap: 3rem; padding: 4rem 2rem; max-width: 1200px; margin: 0 auto; }
        .movie-poster-large img { width: 300px; height: 450px; object-fit: cover; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .movie-info-main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .movie-title-main { font-size: 3rem; margin-bottom: 1rem; }
        .movie-meta { display: flex; gap: 1.5rem; margin-bottom: 1rem; color: #aaa; }
        .movie-rating-badge { background: linear-gradient(135deg, #667eea, #764ba2); padding: 0.3rem 0.8rem; border-radius: 8px; color: #fff; }
        .movie-genres { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
        .genre-tag { background: rgba(255,255,255,0.1); padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.85rem; }
        .movie-overview { color: #aaa; line-height: 1.8; margin-bottom: 2rem; }
        
        .btn-play-large { display: inline-flex; align-items: center; gap: 0.75rem; padding: 1rem 2.5rem; font-size: 1.1rem; border: none; border-radius: 50px; cursor: pointer; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; transition: transform 0.3s, box-shadow 0.3s; }
        .btn-play-large:hover { transform: scale(1.05); box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4); }
        
        .movie-details { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .section-title-small { font-size: 1.5rem; margin-bottom: 1rem; }
        
        .back-btn { position: fixed; top: 100px; left: 20px; z-index: 1001; display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; background: rgba(255,255,255,0.1); border-radius: 30px; color: #fff; text-decoration: none; backdrop-filter: blur(10px); transition: background 0.3s; }
        .back-btn:hover { background: rgba(255,255,255,0.2); }
        
        @media (max-width: 768px) {
            .movie-hero-content { flex-direction: column; align-items: center; text-align: center; }
            .movie-title-main { font-size: 2rem; }
            .movie-meta { justify-content: center; flex-wrap: wrap; }
            .movie-genres { justify-content: center; }
            .movie-poster-large img { width: 200px; height: 300px; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Назад</a>
    
    <nav class="navbar">
        <div class="nav-logo">Buzz-Net</div>
        <div class="nav-links">
            <a href="index.html">Главная</a>
            <a href="index.html#content">Фильмы</a>
        </div>
    </nav>

    <div id="loading">
        <div class="spinner"></div>
        <p style="margin-top: 1rem;">Загрузка...</p>
    </div>

    <div id="movie-page" style="display: none;"></div>

    <script>
        // Kinopoisk API Configuration
        const API_CONFIG = {
            kinopoisk: {
                baseUrl: 'https://kinopoiskapiunofficial.tech/api/v2.2',
                apiKey: 'bac17c2e-8a75-43d9-8a85-505759f9fc99',
                imageBase: 'https://kinopoiskapiunofficial.tech/images'
            }
        };

        // Get movie ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        let movieId = urlParams.get('id');
        
        // Проверка и валидация ID - редирект если невалидный
        if (!movieId || movieId === 'undefined' || isNaN(movieId)) {
            window.location.href = 'index.html';
        } else {
            movieId = parseInt(movieId);
        }
        
        const movieType = urlParams.get('type') || 'movie';
        let currentMovie = null;

        function getPosterUrl(path, size = 'posters') {
            if (!path) return 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMzAwIiB2aWV3Qm94PSIwIDAgMjAwIDMwMCI+PHJlY3Qgd2lkdGg9IjIwMCIgaGVpZ2h0PSIzMDAiIGZpbGw9IiMxYTFhMmUiLz48dGV4dCB4PSIxMDAiIHk9IjE1MCIgZm9udC1zaXplPSIyMCIgZmlsbD0iIzY2N2VlYSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPlBvc3RlcjwvdGV4dD48L3N2Zz4=';
            if (path.startsWith('http')) return path;
            return API_CONFIG.kinopoisk.imageBase + '/' + size + path;
        }

        async function fetchFromKinopoisk(endpoint, params = {}) {
            const url = new URL(`${API_CONFIG.kinopoisk.baseUrl}${endpoint}`);
            
            Object.entries(params).forEach(([key, value]) => {
                url.searchParams.append(key, value);
            });
            
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);
            
            try {
                const response = await fetch(url.toString(), {
                    signal: controller.signal,
                    headers: {
                        'X-API-KEY': API_CONFIG.kinopoisk.apiKey,
                        'Content-Type': 'application/json'
                    }
                });
                clearTimeout(timeoutId);
                
                if (!response.ok) throw new Error(`Kinopoisk Error: ${response.status}`);
                
                return await response.json();
            } catch (error) {
                clearTimeout(timeoutId);
                console.error('Kinopoisk fetch error:', error);
                throw error;
            }
        }

        async function loadMovieDetails() {
            if (!movieId) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const data = await fetchFromKinopoisk(`/films/${movieId}`);
                currentMovie = data;
                
                document.title = `${data.nameRu || data.nameEn || 'Фильм'} — Buzz-Net`;
                
                renderMoviePage(data);
            } catch (error) {
                console.error('Error loading movie:', error);
                document.getElementById('loading').innerHTML = `
                    <p style="color: #f093fb;">Не удалось загрузить информацию о фильме</p>
                    <a href="index.html" class="btn-play-large" style="margin-top: 1rem; text-decoration: none;">На главную</a>
                `;
            }
        }

        function renderMoviePage(movie) {
            document.getElementById('loading').style.display = 'none';
            const page = document.getElementById('movie-page');
            page.style.display = 'block';
            
            const title = movie.nameRu || movie.nameEn || 'Unknown';
            const year = movie.year || '';
            const overview = movie.description || 'Описание недоступно.';
            const rating = movie.ratingKinopoisk || movie.rating || 'N/A';
            
            const posterUrl = getPosterUrl(movie.posterUrl);
            const backdropUrl = movie.backdropUrl || movie.posterUrl;
            
            const genres = movie.genres?.map(g => g.genre).join(', ') || 'Фильм';
            
            page.innerHTML = `
                <div class="movie-hero">
                    <div class="movie-backdrop" style="background-image: url('${backdropUrl}')"></div>
                    <div class="movie-hero-content">
                        <div class="movie-poster-large">
                            <img src="${posterUrl}" alt="${title}">
                        </div>
                        <div class="movie-info-main">
                            <h1 class="movie-title-main">${title}</h1>
                            <div class="movie-meta">
                                <span><i class="fas fa-calendar"></i> ${year}</span>
                                <span><i class="fas fa-clock"></i> ${movie.filmLength || 'N/A'} мин</span>
                                <span class="movie-rating-badge">
                                    <i class="fas fa-star"></i> ${rating}
                                </span>
                            </div>
                            <div class="movie-genres">
                                ${movie.genres?.map(g => `<span class="genre-tag">${g.genre}</span>`).join('') || ''}
                            </div>
                            <p class="movie-overview">${overview}</p>
                            <div class="movie-actions">
                                <button class="btn-play-large" onclick="playMovie()">
                                    <i class="fas fa-play"></i> Смотреть
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="movie-details">
                    <h3 class="section-title-small"><i class="fas fa-info-circle"></i> О фильме</h3>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem;">
                        <div style="background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 8px;">
                            <div style="color: var(--text-muted); font-size: 0.85rem;">Страна</div>
                            <div>${movie.countries?.map(c => c.country).join(', ') || 'N/A'}</div>
                        </div>
                        <div style="background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 8px;">
                            <div style="color: var(--text-muted); font-size: 0.85rem;">Жанр</div>
                            <div>${genres}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function playMovie() {
            if (!currentMovie) return;
            
            const title = currentMovie.nameRu || currentMovie.nameEn;
            const year = currentMovie.year || '';
            
            // Сразу открываем Rutor в новой вкладке для поиска
            const searchTitle = year ? `${title} ${year}` : title;
            window.open(`https://rutor.info/search/${encodeURIComponent(searchTitle)}`, '_blank');
            
            // И показываем модалку для ввода magnet
            showMagnetInput(title);
        }

        function showMagnetInput(title) {
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center;
                z-index: 10000; padding: 1rem;
            `;
            
            modal.innerHTML = `
                <div style="background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 2rem; border-radius: 16px; max-width: 450px; width: 100%; text-align: center;">
                    <h3 style="margin-bottom: 1rem;">${title}</h3>
                    <p style="color: #999; margin-bottom: 1rem;">
                        Найдите торрент на Rutor, скопируйте magnet-ссылку и вставьте ниже
                    </p>
                    <input type="text" id="magnet-input" placeholder="magnet:?xt=..." 
                           style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #333; 
                                  background: #1a1a2e; color: white; margin-bottom: 1rem; font-family: monospace;">
                    <button class="btn-play-large" style="width: 100%; border: none; cursor: pointer;" onclick="playMagnet()">
                        <i class="fas fa-play"></i> Воспроизвести
                    </button>
                    <button onclick="this.closest('[style*=\\"position: fixed\\"]').remove()" 
                            style="width: 100%; margin-top: 0.5rem; padding: 1rem; background: linear-gradient(135deg, #f093fb, #f5576c); 
                                   border: none; color: white; border-radius: 50px; cursor: pointer;">
                        Закрыть
                    </button>
                </div>
            `;
            
            document.body.appendChild(modal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.remove();
            });
        }

        function playMagnet() {
            const magnetInput = document.getElementById('magnet-input');
            const magnet = magnetInput?.value.trim();
            
            if (magnet && (magnet.startsWith('magnet:') || magnet.includes('magnet:'))) {
                document.querySelector('[style*="position: fixed"]')?.remove();
                
                if (typeof WebTorrent === 'undefined') {
                    const script = document.createElement('script');
                    script.src = 'https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js';
                    script.onload = () => playWithWebTorrent(magnet);
                    document.head.appendChild(script);
                } else {
                    playWithWebTorrent(magnet);
                }
            } else {
                alert('Введите корректную magnet-ссылку');
            }
        }

        function playWithWebTorrent(magnet) {
            const client = new WebTorrent();
            
            const modal = document.createElement('div');
            modal.id = 'torrent-player-modal';
            modal.style.cssText = `
                position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                background: #000; z-index: 10001;
            `;
            modal.innerHTML = `
                <div style="position: absolute; top: 20px; right: 20px; z-index: 10002;">
                    <button onclick="document.getElementById('torrent-player-modal')?.remove();" 
                            style="background: rgba(255,255,255,0.2); border: none; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer;">
                        ✕ Закрыть
                    </button>
                </div>
                <div id="player-stats" style="position: absolute; bottom: 20px; left: 20px; color: white; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; font-family: monospace;">
                    Загрузка торрента...
                </div>
                <video id="torrent-video" controls style="width: 100%; height: 100%;"></video>
            `;
            
            document.body.appendChild(modal);
            
            client.add(magnet, (torrent) => {
                const video = document.getElementById('torrent-video');
                const stats = document.getElementById('player-stats');
                
                const file = torrent.files.find(f => {
                    const ext = f.name.split('.').pop().toLowerCase();
                    return ['mp4', 'webm', 'mkv', 'avi'].includes(ext);
                });
                
                if (file) {
                    file.renderTo(video);
                    video.play();
                    stats.textContent = 'Сидов: ' + torrent.numPeers;
                    
                    setInterval(() => {
                        if (stats) {
                            const speed = torrent.downloadSpeed;
                            const speedStr = speed < 1024 ? speed + ' B/s' : (speed / 1024).toFixed(1) + ' KB/s';
                            stats.textContent = 'Сидов: ' + torrent.numPeers + ' | Скорость: ' + speedStr;
                        }
                    }, 1000);
                } else {
                    stats.textContent = 'Видеофайл не найден';
                }
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadMovieDetails);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('[style*="position: fixed"]').forEach(m => m.remove());
            }
        });
    </script>
</body>
</html>
